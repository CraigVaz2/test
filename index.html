<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Location</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked location">
  <script>
    let audioContextResumed = false;
    document.addEventListener('click', function resumeAudio() {
      if (!audioContextResumed) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const audioContext = new AudioContext();
          if (audioContext.state === 'suspended') audioContext.resume();
        }
        const audio = document.getElementById('valentine');
        if (audio) {
          audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(e => console.log("Audio ready"));
        }
        audioContextResumed = true;
        document.removeEventListener('click', resumeAudio);
      }
    }, { once: true });
  </script>

  <div class="container" id="main-content">
    <div id="login-ui">
      <h1 style="letter-spacing: 5px;">LOCKED</h1>
      <p>Enter the code to proceed.</p>
      <input type="password" id="codeInput" placeholder="•••••">
      <button type="button" onclick="checkCode()">Unlock</button>
      <p id="error" class="error" style="color: #ff6666; margin-top: 10px;"></p>
    </div>
    <div id="cinematic-text" class="hidden"></div>
  </div>

  <audio id="valentine" preload="auto">
    <source src="./valentine.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
