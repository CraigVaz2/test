<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Location</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked location">

  <div id="bg-overlay" class="overlay"></div>

  <div class="container" id="main-content">
    <div id="login-ui">
      <h1 style="letter-spacing: 5px;">LOCKED</h1>
      <p class="warning">Enter the code to proceed.</p>
      <input type="password" id="codeInput" placeholder="•••••">
      <button type="button" onclick="checkCode()">Unlock</button>
      <p id="error" class="error"></p>
    </div>
  </div>

  <audio id="valentine" preload="auto">
    <source src="./valentine.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
