<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="screen-login" class="active">
    <div class="box">
      <h1>LOCKED</h1>
      <p>Enter Code:</p>
      <input type="text" id="passcode" placeholder="00000">
      <button onclick="checkCode()">Unlock</button>
      <p id="error-msg" style="color: red;"></p>
    </div>
  </div>

  <div id="screen-cinematic" class="hidden">
    <div id="cinematic-content"></div>
  </div>

  <div id="screen-question" class="hidden">
    <h1>...because you stole my heart.</h1>
    <p>Will you be my Valentine?</p>
    <div class="button-row">
      <button id="yes-btn">Yes ❤️</button>
      <button id="no-btn">No</button>
    </div>
  </div>

  <div id="screen-final" class="hidden">
    <p>Success!</p>
    <div class="calendar" onclick="alert('Feb 14 @ 7pm!')">📅</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
